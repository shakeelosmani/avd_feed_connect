name: Build & Release Flatpak

# On a version tag: build + sign the app, publish the single-file bundle to a
# GitHub Release, and refresh the signed Flatpak repo + .flatpakref on GitHub
# Pages (so `flatpak install <pages>/…​.flatpakref` and `flatpak update` work).
#   push tag  vX.Y.Z   -> full release (bundle + Pages)
#   manual dispatch    -> build only (bundle uploaded as a run artifact)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release + gh-pages push

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Import signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg"
          echo "$KEY" | base64 -d | gpg --batch --import
          gpg --export "${{ secrets.FLATPAK_GPG_KEYID }}" | base64 -w0 > pubkey.b64

      - name: Pin app module to this commit
        run: |
          set -eu
          m=io.github.shakeelosmani.avd_feed_connect.yml
          awk -v sha="$GITHUB_SHA" '
            /avd_feed_connect\.git/ { print; getline; sub(/commit:.*/, "commit: " sha); print; next }
            { print }
          ' "$m" > "$m.tmp" && mv "$m.tmp" "$m"

      # The action installs the runtime/SDK, builds into ./repo, signs it, and
      # produces the single-file bundle.
      - name: Build (signed)
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.shakeelosmani.avd_feed_connect.yml
          cache-key: flatpak-builder-${{ github.sha }}
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEYID }}

      - name: Re-sign repo summary
        run: flatpak build-update-repo repo --gpg-sign="${{ secrets.FLATPAK_GPG_KEYID }}"

      # Build the bundle ourselves so it embeds the Pages repo URL + signing key
      # → installs from the bundle are ALSO updatable via `flatpak update`.
      - name: Make updatable, signed bundle
        run: |
          set -eu
          gpg --export "${{ secrets.FLATPAK_GPG_KEYID }}" > pubkey.gpg
          flatpak build-bundle \
            --repo-url=https://shakeelosmani.github.io/avd_feed_connect/repo \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --gpg-keys=pubkey.gpg \
            repo avd_feed_connect.flatpak io.github.shakeelosmani.avd_feed_connect stable

      - name: Assemble GitHub Pages site (repo + flatpakref)
        run: |
          set -eu
          mkdir -p site/repo
          cp -r repo/* site/repo/
          touch site/.nojekyll
          cat > site/avd_feed_connect.flatpakref <<EOF
          [Flatpak Ref]
          Name=io.github.shakeelosmani.avd_feed_connect
          Branch=stable
          Url=https://shakeelosmani.github.io/avd_feed_connect/repo
          Title=AVD Feed + Connect (Linux)
          IsRuntime=false
          GPGKey=$(cat pubkey.b64)
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          SuggestRemoteName=avd-feed-connect
          EOF
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>AVD Feed + Connect</title>
          <h1>AVD Feed + Connect (Linux)</h1>
          <p>Install (double-click):
          <a href="avd_feed_connect.flatpakref">avd_feed_connect.flatpakref</a></p>
          <p><a href="https://github.com/shakeelosmani/avd_feed_connect">Source &amp; releases</a></p>
          EOF

      - name: Deploy to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: avd_feed_connect.flatpak
          generate_release_notes: true
          body: |
            ## Install

            **One click:** open
            [avd_feed_connect.flatpakref](https://shakeelosmani.github.io/avd_feed_connect/avd_feed_connect.flatpakref)
            — or `flatpak install --user https://shakeelosmani.github.io/avd_feed_connect/avd_feed_connect.flatpakref`

            **Or** download `avd_feed_connect.flatpak` below and
            `flatpak install --user avd_feed_connect.flatpak`.

            Bundles a hardened FreeRDP (pulse hot-unplug fixes + camera redirection).

      - name: Upload bundle artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: avd_feed_connect-flatpak
          path: avd_feed_connect.flatpak
