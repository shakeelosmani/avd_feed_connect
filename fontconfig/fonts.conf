<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  App-wide fontconfig, pointed at by FONTCONFIG_FILE in the Flatpak manifest.

  WebKitGTK 6.0's Skia backend enumerates EVERY font family (via
  FcConfigGetFonts / SkFontMgr_fontconfig::GetFamilyNames) the first time it lays
  out text. On a host with thousands of fonts that scan never finishes: the
  "Sign in with Microsoft" WebView stays a blank white window and its
  WebKitWebProcess pins a core at 100% CPU (issue #57).

  This config deliberately does NOT include the runtime's /etc/fonts/fonts.conf.
  That file pulls in Flatpak's /run/host/font-dirs.xml, whose <remap-dir>
  entries scan the host's font tree (/run/host/fonts) but record every font
  under its ORIGINAL host path (/usr/share/fonts/...). A <rejectfont> glob on
  /run/host therefore never matches, and rejecting /usr/share/fonts would also
  drop the runtime's own fonts (same namespace). So instead we never add the
  host dirs at all: list only the real in-sandbox font dirs explicitly, and pull
  in just the rendering/alias snippets from conf.d (which add no font dirs).

  We ship this under /app (not the per-app config dir) because WebKit runs its
  web process in a nested flatpak-spawn sandbox that does NOT see the per-app
  config dir but DOES see /app and inherits FONTCONFIG_FILE, so the fix applies
  without disabling the WebKit sandbox that guards the SSO-cookie WebView.

  The app is a launcher: it and the bundled FreeRDP client only need the
  runtime's fonts, so losing the host set is fine.
-->
<fontconfig>
  <!-- Real in-sandbox font directories only (NOT the /run/host remaps). -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/app/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <!-- Writable + runtime cache dirs. -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/usr/lib/fontconfig/cache</cachedir>
  <cachedir>/var/cache/fontconfig</cachedir>

  <!-- Rendering defaults and generic-family aliases (sans-serif/serif/mono) so
       web content resolves to a real font. conf.d adds no <dir> entries, so no
       host fonts sneak back in. -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
</fontconfig>
