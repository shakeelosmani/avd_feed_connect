<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  App-wide fontconfig, pointed at by FONTCONFIG_FILE in the Flatpak manifest.

  WebKitGTK 6.0's Skia backend enumerates EVERY installed font family (via
  fontconfig's FcConfigGetFonts / SkFontMgr_fontconfig::GetFamilyNames) the
  first time it lays out text. On a host with thousands of fonts that scan
  never finishes: the "Sign in with Microsoft" WebView stays a blank white
  window and its WebKitWebProcess pins a core at 100% CPU (issue #57).

  The launcher UI and the bundled FreeRDP client only need the GNOME runtime's
  own fonts, so we reject the host's font tree app-wide. We ship this file under
  /app (not the per-app config dir) precisely because WebKit runs its web
  process in a nested flatpak-spawn sandbox that does NOT see the per-app config
  dir but DOES see /app, so the fix applies without having to disable the WebKit
  sandbox that guards the SSO-cookie WebView.
-->
<fontconfig>
  <!-- Keep the runtime's own config: cache dirs, bundled font directories,
       aliases and defaults all come from here. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Drop the host's fonts that Flatpak mounts under /run/host. -->
  <selectfont>
    <rejectfont>
      <glob>/run/host/fonts</glob>
      <glob>/run/host/fonts/*</glob>
      <glob>/run/host/local-fonts</glob>
      <glob>/run/host/local-fonts/*</glob>
      <glob>/run/host/user-fonts</glob>
      <glob>/run/host/user-fonts/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
