# Flatpak manifest for AVD Feed + Connect (Linux).
#
# Bundles a purpose-built SDL3 FreeRDP client so the app connects end-to-end on
# any machine, with two things a stock FreeRDP lacks:
#   * the pulse hot-unplug + rdpsnd busy-loop fixes (FreeRDP PR #13334, now
#     MERGED to upstream master) — without them an audio-device change mid Teams
#     call FREEZES the whole session.
#   * the camera-redirection channel (-DCHANNEL_RDPECAM_CLIENT=ON).
#
# Builds and runs on GNOME 51; every source is pinned to a commit for
# reproducibility.
app-id: io.github.shakeelosmani.avd_feed_connect
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: avd-feed-connect

finish-args:
  - --share=network                 # feed discovery, AAD sign-in, RDP gateway
  - --share=ipc
  # Real X11 socket (not fallback-x11): the bundled FreeRDP SDL client is
  # unstable on native Wayland, so connections are forced onto X11/XWayland and
  # the socket must exist even on a Wayland host. The launcher GUI renders via
  # XWayland there too. (Only one graphics socket — Flathub disallows x11+wayland.)
  - --socket=x11
  - --socket=pulseaudio             # RDP audio playback + microphone redirect
  - --device=dri                    # GPU for the RDP graphics pipeline
  - --device=all                    # webcam (camera redirection) + input
  - --talk-name=org.kde.StatusNotifierWatcher   # tray icon
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets         # login keyring (libsecret) for the refresh token
  - --env=LD_LIBRARY_PATH=/app/lib

# NOTE on ffmpeg: FreeRDP is built WITH_FFMPEG against the GNOME runtime's own
# ffmpeg (its freedesktop base ships libav*). The org.freedesktop.Platform
# .ffmpeg-full extension is intentionally NOT used. If the audin microphone path
# needs the AAC encoder and the base ffmpeg lacks it, add a bundled ffmpeg here.

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ---- SDL3 + SDL3_ttf (not in the GNOME runtime) ------------------------
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.2.30
        commit: f5e5f6588921eed3d7d048ce43d9eb1ff0da0ffc

  - name: sdl3-ttf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # Use the runtime's freetype; skip vendored harfbuzz (its in-source CMake
      # guard breaks the build) and plutosvg — the FreeRDP SDL UI is plain text.
      - -DSDLTTF_VENDORED=OFF
      - -DSDLTTF_HARFBUZZ=OFF
      - -DSDLTTF_PLUTOSVG=OFF
      - -DSDLTTF_SAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        tag: release-3.2.2
        commit: a1ce3670aec736ecbf0936c43f2f0cc53aa61e5b

  # ---- small FreeRDP deps not guaranteed in the runtime ------------------
  - name: cjson
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_CJSON_TEST=OFF
      - -DBUILD_SHARED_AND_STATIC_LIBS=OFF
      # cJSON's cmake_minimum_required predates CMake 3.5, which the GNOME
      # SDK's CMake refuses; allow it to configure anyway.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/DaveGamble/cJSON.git
        tag: v1.7.18
        commit: acc76239bee01d8e9c858ae2cab296704e52d916

  # libusb-1.0 — required by the rdpecam V4L camera subsystem (UVC H.264).
  # (The V4L HAL itself only needs <linux/videodev2.h>, which the SDK ships, so
  # no libv4l package is required.)
  - name: libusb
    buildsystem: autotools
    config-opts:
      - --disable-udev
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
        sha256: ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575

  # ---- the FreeRDP SDL3 client, our -cam tree with the pulse fixes -------
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true    # FreeRDP forbids in-source builds
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_CLIENT_SDL=ON
      - -DWITH_CLIENT_SDL3=ON
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_AAD=ON            # connection-time AAD token acquisition
      # No FreeRDP-side WebView: WITH_WEBVIEW=OFF makes /sec:aad print
      # "Browse to: <url>" and read the redirect URL from stdin. The app drives
      # that over a PTY and resolves the URL in its own hidden webview (sharing
      # the launcher's SSO cookies), so the connection-time token is silent and
      # there is no second embedded browser to blank out / crash.
      - -DWITH_WEBVIEW=OFF
      - -DWITH_PULSE=ON
      - -DWITH_FFMPEG=ON
      - -DWITH_SWSCALE=ON
      - -DWITH_X11=ON
      - -DWITH_KRB5=OFF          # AVD gateway uses AAD, not kerberos — keeps deps lean
      - -DWITH_FUSE=OFF          # FUSE clipboard file-copy; not needed, avoids fuse3 dep
      - -DWITH_MANPAGES=OFF
      - -DCHANNEL_RDPECAM_CLIENT=ON
      - -DWINPR_UTILS_IMAGE_PNG=ON
      - -DWINPR_UTILS_IMAGE_JPEG=ON
      - -DWINPR_UTILS_IMAGE_WEBP=ON
      - -DWINPR_UTILS_IMAGE_DIBv5=ON
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        # FreeRDP 3.32.1, the first tag containing everything we previously
        # pinned master (8b5d1c40) for: the pulse hot-unplug + rdpsnd
        # busy-loop fixes (PR #13334), the rdpecam stream-drain LED fix
        # (3.32.0), and the rdpecam media-type validation fix (249d74364a) that
        # makes V4L camera redirection work. It also picks up later cliprdr
        # fixes (#13496, #13527) that stop the WinPR assert abort seen with the
        # master snapshot (#7). Camera redirection is a build option, enabled
        # via config-opts.
        tag: 3.32.1
        commit: bf217a504e54cc719880c228e82353382cd7d4fa
      # Backport of FreeRDP PR #13569 (merged to master 2026-10-02, not yet in
      # a release). 3.32.1 only knows the "text/plain" clipboard format, but on
      # XWayland the local clipboard is announced as UTF8_STRING /
      # text/plain;charset=utf-8, so local → remote paste stored the text as
      # CF_RAW and failed with "No synthesizer for format CF_RAW". Drop these
      # once the pinned FreeRDP tag includes #13569.
      - type: patch
        paths:
          - patches/freerdp-0001-crt-unicode-add-internal-utf8-to-from-utf-escaped-st.patch
          - patches/freerdp-0002-winpr-clipboard-implement-text-plain-codepage-utf-.patch
          - patches/freerdp-0003-winpr-clipboard-add-attributes-malloc-and-nodiscar.patch
          - patches/freerdp-0004-winpr-clipboard-Add-ClipboardRegisterSynthesizerEx.patch
          - patches/freerdp-0005-client-x11-distinguish-between-text-plain-and.patch
          - patches/freerdp-0006-client-sdl-support-text-plain-charset-utf-8.patch
          # Fixes a hang in 0001 on text like "C:\users"; upstream as FreeRDP#13616 (not merged yet)
          - patches/freerdp-0007-winpr-crt-fix-endless-loop-in-winpr_utfEscapedStrin.patch

  # ---- the app itself ----------------------------------------------------
  - name: avd-feed-connect
    buildsystem: simple
    build-commands:
      - install -d /app/share/avd-feed-connect
      - cp -r src/avd_feed_connect /app/share/avd-feed-connect/avd_feed_connect
      - find /app/share/avd-feed-connect/avd_feed_connect -name __pycache__ -type d -exec rm -rf {} +
      - install -Dm755 src/avdfeed.py       /app/share/avd-feed-connect/avdfeed.py
      - install -Dm755 src/avd_feed_gui.py  /app/share/avd-feed-connect/avd_feed_gui.py
      - install -Dm755 avd-feed-connect     /app/bin/avd-feed-connect
      - install -Dm644 io.github.shakeelosmani.avd_feed_connect.desktop
        /app/share/applications/io.github.shakeelosmani.avd_feed_connect.desktop
      - install -Dm644 io.github.shakeelosmani.avd_feed_connect.metainfo.xml
        /app/share/metainfo/io.github.shakeelosmani.avd_feed_connect.metainfo.xml
      - install -Dm644 io.github.shakeelosmani.avd_feed_connect.svg
        /app/share/icons/hicolor/scalable/apps/io.github.shakeelosmani.avd_feed_connect.svg
      - install -Dm644 io.github.shakeelosmani.avd_feed_connect-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/io.github.shakeelosmani.avd_feed_connect-symbolic.svg
      # Tray icon dir handed to the host as IconThemePath. Quickshell loads
      # <dir>/<IconName> verbatim (no extension); other hosts add ".svg".
      - install -Dm644 io.github.shakeelosmani.avd_feed_connect-symbolic.svg
        /app/share/avd-feed-connect/tray/io.github.shakeelosmani.avd_feed_connect-symbolic.svg
      - install -Dm644 io.github.shakeelosmani.avd_feed_connect-symbolic.svg
        /app/share/avd-feed-connect/tray/io.github.shakeelosmani.avd_feed_connect-symbolic
    sources:
      - type: git
        url: https://github.com/shakeelosmani/avd_feed_connect.git
        commit: ddf6aa33b9fe09df5c25ff47f9e26c5613165070
